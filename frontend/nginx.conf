# ============================================================
# Nginx configuration for React Single Page App
# ============================================================
# React Router handles routing on the client side (in the browser).
# If someone refreshes the page on /bookings, Nginx would normally
# look for a folder called "bookings" and return 404.
#
# The "try_files" line below fixes this:
#   → First, try to serve the exact file requested
#   → If no file found, serve index.html and let React Router handle it
# ============================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
