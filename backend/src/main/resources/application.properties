spring.application.name=railway-reservation

# loads application-local.properties on top of this file (personal overrides,
# git-ignored - see application-local.properties.example)
spring.profiles.active=local

# MySQL - shared defaults; override username/password in application-local.properties
spring.datasource.url=jdbc:mysql://localhost:3306/eureka_railway?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT - this is only a DEV-DEFAULT so the app can boot; every developer should
# override app.jwt.secret in application-local.properties (any random string,
# at least 32 characters for HS256). In production it would come from an
# environment variable, never from a committed file.
app.jwt.secret=dev-only-default-change-me-in-application-local-properties
app.jwt.expiration-ms=86400000

# Razorpay TEST MODE - keep real keys in application-local.properties, never here.
# With enabled=false bookings are confirmed immediately without payment.
razorpay.enabled=false
razorpay.key-id=rzp_test_paste_your_key_id
razorpay.key-secret=paste_your_key_secret

# Email (Gmail SMTP). Real sending is off by default; enable it and put your
# Gmail address + App Password in application-local.properties.
app.mail.enabled=false
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# bound how long a slow SMTP server can block a request (milliseconds)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

server.port=8080
