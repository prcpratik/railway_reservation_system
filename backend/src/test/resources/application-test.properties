# in-memory H2 database for tests, in MySQL-compatibility mode.
# LOCK_TIMEOUT gives blocked transactions time to acquire the row lock.
spring.datasource.url=jdbc:h2:mem:railwaytest;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=test-only-jwt-secret-key-at-least-32-characters-long
app.jwt.expiration-ms=86400000

# no real payment during tests
razorpay.enabled=false
razorpay.key-id=rzp_test_dummy
razorpay.key-secret=dummy
